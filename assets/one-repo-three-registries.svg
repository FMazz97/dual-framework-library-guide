<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 640"
     width="1280"
     height="640"
     font-family="DejaVu Sans, Arial, Helvetica, sans-serif">

  <rect width="1280" height="640" fill="#0f172a"/>
  <rect x="0" y="0" width="12" height="640" fill="#14b8a6"/>

  <text x="60" y="130" font-size="60" font-weight="700" fill="#f8fafc">
    Native libraries for
  </text>
  <text x="60" y="200" font-size="60" font-weight="700" fill="#f8fafc">
    Arduino &amp; ESP-IDF
  </text>
  <text x="60" y="260" font-size="26" fill="#94a3b8">
    One repository · one core · three registries
  </text>

  <!-- source node -->
  <rect x="60" y="400" width="380" height="150" rx="16"
        fill="#1e293b" stroke="#14b8a6" stroke-width="3"/>

  <text x="90" y="455"
        font-size="30"
        font-weight="700"
        fill="#f8fafc">
    One repository
  </text>

  <text x="90" y="495"
        font-size="20"
        fill="#cbd5e1">
    framework-agnostic core
  </text>

  <text x="90" y="525"
        font-size="20"
        fill="#cbd5e1">
    + compile-time HAL
  </text>

  <!-- connectors -->
  <g fill="none"
     stroke="#14b8a6"
     stroke-width="3"
     stroke-linecap="round">
    <path d="M440 475 C 620 475, 640 385, 800 385"/>
    <path d="M440 475 L 800 475"/>
    <path d="M440 475 C 620 475, 640 565, 800 565"/>
  </g>

  <g fill="#14b8a6">
    <circle cx="440" cy="475" r="6"/>
    <circle cx="800" cy="385" r="6"/>
    <circle cx="800" cy="475" r="6"/>
    <circle cx="800" cy="565" r="6"/>
  </g>

  <!-- targets -->
  <rect x="810" y="350" width="410" height="70" rx="12"
        fill="#1e293b"
        stroke="#475569"
        stroke-width="2"/>

  <text x="840" y="394"
        font-size="26"
        fill="#f8fafc">
    Arduino Library Manager
  </text>

  <rect x="810" y="440" width="410" height="70" rx="12"
        fill="#1e293b"
        stroke="#475569"
        stroke-width="2"/>

  <text x="840" y="484"
        font-size="26"
        fill="#f8fafc">
    ESP Component Registry
  </text>

  <rect x="810" y="530" width="410" height="70" rx="12"
        fill="#1e293b"
        stroke="#475569"
        stroke-width="2"/>

  <text x="840" y="574"
        font-size="26"
        fill="#f8fafc">
    PlatformIO Registry
  </text>

</svg>